[project]
name = "screddy-health"
version = "0.1.0"
description = "Apple Health digest engine — twice-weekly narrative briefings, sickness early-warning, and edge-triggered emergency alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Shawn Reddy" },
]
keywords = ["apple-health", "health-monitoring", "hrv", "telegram-bot", "personal-analytics", "anomaly-detection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Communications :: Chat",
]

dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.1",  # only needed for optional DATABASE_URL Postgres integration; safe to import without it
]

[project.optional-dependencies]
# Required only if you want screddy.agents.health_monitor.ask_llm_for_message
# to render pattern-alert Telegram messages via OpenAI. The digest pipeline
# (health_digest.py) uses its own /chat endpoint and does not need this.
openai = [
  "openai>=2.0",
]
dev = [
  "pytest>=8",
  "respx>=0.22",
  "openai>=2.0",  # tests for health_monitor exercise the openai path
]

[project.urls]
Homepage = "https://github.com/Screddyice/screddy-health"
Repository = "https://github.com/Screddyice/screddy-health"
Issues = "https://github.com/Screddyice/screddy-health/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
